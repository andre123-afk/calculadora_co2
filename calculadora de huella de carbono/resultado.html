<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EcoMarket - Resultado</title>

    <link rel="stylesheet" href="../css/components.css">
    <link rel="stylesheet" href="../css/animations.css">
    <link rel="stylesheet" href="../css/main.css">

</head>
<body>

    <section class="seccion-calculadora">
        <div class="calculadora-card">
            
            <div class="card-header">
                <div class="header-logo">
                    <span class="icon-tree"></span>
                    <span>Tu Impacto Ecológico</span>
                </div>
                <button class="close-btn" onclick="window.history.back();">&times;</button>
            </div>

            <div class="card-body">
                <h2>Cálculo Procesado</h2>
                
                <div class="resultado-destacado">
                    <span>¡Logrado!</span>
                    <span class="unidad">Tus datos han sido enviados con éxito.</span>
                </div>

                <p class="mensaje-ecologico">
                    "Muchas gracias por medir tu impacto ambiental. Cada pequeña acción cuenta para preservar nuestros bosques."
                </p>

                <button type="button" class="btn-calcular" onclick="window.history.back();">
                    Volver a la calculadora
                </button>
            </div>
        </div>
    </section>

</body>
</html>
